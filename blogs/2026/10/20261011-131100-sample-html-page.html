<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>示例HTML页面</title>
  <style>
    body {
      margin: 0;
      padding: 32px 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.7;
      color: #1f2328;
    }
    .card {
      max-width: 560px;
      margin: 0 auto;
      padding: 24px;
      border: 1px solid #d8dee4;
      border-radius: 12px;
      background: #f6f8fa;
    }
    h1 { font-size: 22px; margin: 0 0 12px; }
    button {
      font-size: 15px;
      padding: 8px 18px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #ffffff;
      cursor: pointer;
    }
    button:hover { background: #f0f6ff; border-color: #0969da; }
    #count { font-size: 20px; font-weight: 600; color: #0969da; margin-left: 12px; }
    .note { color: #57606a; font-size: 13.5px; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card" data-u32-name="示例HTML卡片">
    <h1>这是一个完整的 HTML 博客条目</h1>
    <p>HTML 条目不做 Markdown 渲染，由 index.html 以 iframe 整页嵌入，保留全部交互能力——脚本、样式、动画都可以直接运行。</p>
    <div data-u32-name="交互演示区">
      <button id="btn" type="button">点我 +1</button>
      <span id="count">0</span>
    </div>
    <p class="note">试着点击上面的按钮：iframe 内的 JavaScript 正常工作。</p>
  </div>
  <script>
    var n = 0;
    document.getElementById('btn').addEventListener('click', function () {
      n += 1;
      document.getElementById('count').textContent = n;
    });
  </script>
</body>
</html>
